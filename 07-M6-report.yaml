module: M6
name: "Báo cáo LaTeX + Slides"
owner: "Thành viên E dựng skeleton Overleaf từ tuần 1; mỗi người tự điền phần mình"
depends_on: ["M1", "M2", "M3", "M4", "M5"]
directory: "report/ (Overleaf)"

# ----------------------------------------------------------------------------
# CẤU TRÚC BÁO CÁO
# ----------------------------------------------------------------------------
report_structure:
  - "1. Giới thiệu chủ đề + phát biểu bài toán"
  - "2. Cơ sở lý thuyết: 7 kỹ thuật theo khung Input representation / Training / Prediction"
  - "3. Phương pháp thực nghiệm: kiến trúc harness, benchmark, tham số"
  - "4. Kết quả: bảng ablation A->D + đường cong iteration (M2 vs M4) + RAG + fine-tune"
  - "5. Thảo luận: phân loại lỗi, khám phá mới (hard-coding test, self vs external critique...)"
  - "6. Phân công đóng góp từng thành viên + nguồn kế thừa"

# ----------------------------------------------------------------------------
# DEVIATION BẮT BUỘC GHI (chuẩn 1.3b)
# ----------------------------------------------------------------------------
mandatory_deviations_to_document:
  - item: "Model"
    note: "Dùng 1.3b thay 6.7b do ràng buộc phần cứng. Ảnh hưởng: baseline ~40-50% thay vì 55-65%."
  - item: "Sandbox"
    note: "Không dùng Docker (subprocess + timeout). Ghi rõ giới hạn cách ly."
  - item: "Kế thừa"
    note: "Mọi module ghi rõ phần reused vs self_written (Week0 tr.10)."

